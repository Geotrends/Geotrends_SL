<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images - Ranchera</title>
  <link rel="stylesheet" href="/css/ranchera/imagenes.css">
</head>
<body>
  <div class="panel-imagenes-contenedor">
  <section class="imagenes">
    <h1>Image Explorer</h1>
    <div class="imagenes-contenido" style="opacity: 0; transition: opacity 0.6s ease;">
      <!-- Aquí se insertan los gráficos dinámicamente -->
    </div>
  </section>

  <section class="carrusel">
    <h2>User gallery</h2>
    <label for="selectorUsuario">Select a user:</label>
    <select id="selectorUsuario">
      <option value="">-- Select a user --</option>
    </select>
    <div id="contenedorCarrusel" class="bloque-contenedor">
      <div class="galeria-transicion" style="opacity: 0; transition: opacity 0.6s ease;">
        <div id="galeriaUsuario"></div>
        <div id="bloqueSintesisUsuario">
          <h3 class="titulo-nube">🧠 Visual summary of selected user</h3>
          <div id="nubeEtiquetasUsuario" style="height: 400px; width: 100%; margin-bottom: 1rem;"></div>
          <p id="resumenEtiquetasUsuario" class="descripcion-nube">
            This cloud shows <strong>thematic tags</strong> extracted from images posted by this user. Larger words appear more often and can reveal <strong>content patterns, interests or predominant visual style</strong>.
          </p>
        </div>
      </div>
    </div>
  </section>
  </div>
  <script type="module" src="/js/ranchera/imagenes.js"></script>
</body>
</html>
