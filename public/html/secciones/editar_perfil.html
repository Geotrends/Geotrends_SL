<form id="formEditarPerfil" class="form-perfil">
    <div class="form-group">
      <label for="nombre">First name:</label>
      <input type="text" id="nombre" name="nombre" required />
    </div>
  
    <div class="form-group">
      <label for="apellidos">Last name:</label>
      <input type="text" id="apellidos" name="apellidos" required />
    </div>
  
    <div class="form-group">
      <label for="correo">Email:</label>
      <input type="email" id="correo" name="correo" required />
    </div>
  
    <div class="form-group">
      <label for="organizacion">Organization:</label>
      <input type="text" id="organizacion" name="organizacion" />
    </div>
  
    <div class="form-group">
      <label for="rol_organizacion">Role in organization:</label>
      <input type="text" id="rol_organizacion" name="rol_organizacion" />
    </div>
  
    <button type="submit" class="btn btn-primary">Save changes</button>
  </form>
  
  <div id="mensajeEditarPerfil" class="mensaje"></div>
