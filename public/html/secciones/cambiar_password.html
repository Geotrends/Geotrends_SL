<section class="cambiar-password">
    <h4><i class="fas fa-lock"></i> Change password</h4>
  
    <form id="formCambiarPassword">
      <div class="form-group">
        <label for="actual">Current password</label>
        <input type="password" id="actual" required />
      </div>
  
      <div class="form-group">
        <label for="nueva">New password</label>
        <input type="password" id="nueva" required />
        <small class="hint">At least 8 characters, one uppercase letter and one number</small>
      </div>
  
      <div class="form-group">
        <label for="confirmar">Confirm new password</label>
        <input type="password" id="confirmar" required />
      </div>
  
      <button type="submit" class="btn btn-primary">Update password</button>
      <div id="mensajePassword" class="mensaje"></div>
    </form>
  
    <script>
      document.getElementById('formCambiarPassword').addEventListener('submit', async (e) => {
        e.preventDefault();
        const actual = document.getElementById('actual').value.trim();
        const nueva = document.getElementById('nueva').value.trim();
        const confirmar = document.getElementById('confirmar').value.trim();
        const mensaje = document.getElementById('mensajePassword');
  
        mensaje.textContent = '';
  
        if (nueva !== confirmar) {
          mensaje.textContent = 'Passwords do not match';
          mensaje.style.color = 'red';
          return;
        }
  
        const regex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
        if (!regex.test(nueva)) {
          mensaje.textContent = 'Must be at least 8 characters with one uppercase letter and one number';
          mensaje.style.color = 'red';
          return;
        }
  
        try {
          const token = localStorage.getItem('token');
          const res = await fetch('/api/usuarios/cambiar-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ actual, nueva })
          });
  
          const data = await res.json();
          mensaje.textContent = data.mensaje || data.error || 'Unexpected error';
          mensaje.style.color = res.ok ? 'green' : 'red';
        } catch (error) {
          mensaje.textContent = 'Error connecting to server';
          mensaje.style.color = 'red';
        }
      });
    </script>
  </section>
