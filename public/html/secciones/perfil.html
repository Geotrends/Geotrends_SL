<section class="perfil">
  <h2><i class="fas fa-user"></i> My Profile</h2>

  <div class="perfil-datos">

    <div class="perfil-foto-clickeable" title="Click to change your photo">
      <label for="inputFoto">
        <img id="fotoPerfil" src="/css/isologo-02.png" alt="GeoTrends logo" />
       </label>
      <input type="file" id="inputFoto" accept="image/*" style="display: none;" />
    </div>

    <div class="perfil-info">
      <p><strong>Username:</strong> <span id="perfilUsuario"></span></p>
      <p><strong>First name:</strong> <span id="perfilNombre"></span></p>
      <p><strong>Last name:</strong> <span id="perfilApellidos"></span></p>
      <p><strong>Email:</strong> <span id="perfilCorreo"></span></p>
      <p><strong>Organization:</strong> <span id="perfilOrganizacion"></span></p>
      <p><strong>Role in organization:</strong> <span id="perfilRolOrg"></span></p>
      <p><strong>System role:</strong> <span id="perfilRol"></span></p>
      <p><strong>Registration date:</strong> <span id="perfilFecha"></span></p>
      <p><strong>Last login:</strong> <span id="perfilUltimoAcceso"></span></p>
    </div>

  
  </div>

  <div class="perfil-acciones">
    <button id="btnEditarPerfil" class="btn btn-outline-primary">
      <i class="fas fa-pen"></i> Edit profile
    </button>
    <button id="btnMostrarCambioPass" class="btn btn-outline-secondary">
      <i class="fas fa-key"></i> Change password
    </button>
  </div>

  <div id="seccionEditarPerfil" class="d-none"></div>
  <div id="seccionCambioPassword" class="d-none"></div>

  <div class="perfil-bitacora">
    <h3><i class="fas fa-clock"></i> Recent logins</h3>
    <ul id="listaBitacora"></ul>
  </div>
</section>

<script>
const inputFoto = document.getElementById('inputFoto');
if (inputFoto) {
  inputFoto.addEventListener('change', async () => {
    const archivo = inputFoto.files[0];
    if (!archivo) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      document.getElementById('fotoPerfil').src = e.target.result;
    };
    reader.readAsDataURL(archivo);

    const formData = new FormData();
    formData.append('foto', archivo);

    try {
      const res = await fetch(`/api/usuarios/foto/${usuario}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`
        },
        body: formData
      });

      const resultado = await res.json();
      if (!resultado.ok) {
        alert('Could not update photo');
      }
    } catch (err) {
      console.error('Error uploading photo:', err);
    }
  });
}
</script>
